name: Lint and Test
on:
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: "0 0 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
    - name: Checkout code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: Cache dependencies
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: ~/vendor
        key: test-lint-dependencies-{{ checksum "composer.json" }}
        restore-keys: test-lint-dependencies-{{ checksum "composer.json" }}
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '7.4'
    - name: Install dependencies
      run: composer install -n --prefer-dist
    - name: Run PHP Lint
      run: composer phpcs
  validate-readme-spacing:
    name: Validate README Spacing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - uses: pantheon-systems/validate-readme-spacing@13c5e619ef5fc39632292f1f5261ab31d1904208 # v1.0.6
  test-phpunit:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.3
    name: PHP Unit tests

    steps:
    - name: Checkout code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

    - name: Start MySQL
      run: |
        sudo systemctl start mysql

    - name: Cache dependencies
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: ~/vendor
        key: test-phpunit-dependencies-{{ checksum "composer.json" }}
        restore-keys: test-phpunit-dependencies-{{ checksum "composer.json" }}

    - name: Install Extras
      run: |
        sudo apt-get update
        sudo apt-get install subversion

    # Solr 3.6.2's Jetty start.jar spins forever on the runner's default Java (25).
    - name: Run install-solr.sh
      run: |
        export JAVA_HOME="$JAVA_HOME_21_X64"
        export PATH="$JAVA_HOME/bin:$PATH"
        bash bin/install-solr.sh

    - name: Set PHP version
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.0'
        coverage: none

    - name: Install dependencies
      run: composer install
    - name: "Run Tests"
      run: bash bin/phpunit-test.sh

  test-behat:
    needs:
      - test-phpunit
      - lint
    runs-on: ubuntu-latest
    container:
      image: quay.io/pantheon-public/build-tools-ci:8.x-php7.4
      options: --user root
    env:
      TERMINUS_TOKEN: ${{ secrets.TERMINUS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TERMINUS_ENV: ci-${{github.run_number}}
      TERMINUS_SITE: solr-power
      SITE_ENV: solr-power.ci-${{github.run_number}}
      WORDPRESS_ADMIN_USERNAME: pantheon
      WORDPRESS_ADMIN_EMAIL: no-reply@getpantheon.com
      WORDPRESS_ADMIN_PASSWORD: solr-power.ci-${{github.run_number}}
    name: Behat tests

    steps:
    - name: Checkout code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

    - name: Install SSH key
      uses: webfactory/ssh-agent@836c84ec59a0e7bc0eabc79988384eb567561ee2 # v0.7.0
      with:
        ssh-private-key: ${{ secrets.SITE_OWNER_SSH_PRIVATE_KEY }}

    - name: Cache dependencies
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: ~/vendor
        key: test-behat-dependencies-{{ checksum "composer.json" }}
        restore-keys: test-behat-dependencies-{{ checksum "composer.json" }}

    - name: Check for $TERMINUS_TOKEN
      run: |
        if [ -z "$TERMINUS_TOKEN" ]; then
          echo "TERMINUS_TOKEN environment variables missing; assuming unauthenticated build"
          exit 0
        fi
        terminus auth:login --machine-token=$TERMINUS_TOKEN

    - name: Validate Fixture WordPress Version
      uses: pantheon-systems/plugin-release-actions/validate-fixture-version@554b455c9cb024ccf20147a27656fb198ce6f0cc # v0.5.5
      with:
        terminus_site: ${{ env.TERMINUS_SITE }}
    - name: Prepare for Behat tests
      run: ./bin/behat-prepare.sh

    - name: Execute Behat tests
      run: ./bin/behat-test.sh --strict

    - name: Clean up Behat tests
      run: ./bin/behat-cleanup.sh
