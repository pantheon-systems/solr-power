# This file is managed by github-terraform. Manual changes will be overwritten.
# To modify it, edit orgs/pantheon-systems/files/dependabot/custom/solr-power.yml
# in https://github.com/pantheon-systems/github-terraform
version: 2
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: weekly
    timezone: America/Los_Angeles
    day: tuesday
  target-branch: "main"
  open-pull-requests-limit: 99
  groups:
    composer-minor-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: phpunit/phpunit
    versions:
    - ">= 8.a"
    - "< 9"
  - dependency-name: phpunit/phpunit
    versions:
    - ">= 9.a"
    - "< 10"
  - dependency-name: solarium/solarium
    versions: ["5.x"]
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    timezone: America/Los_Angeles
    day: tuesday
  target-branch: "main"
  open-pull-requests-limit: 99
  groups:
    npm-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "sunday"
    time: "06:00"
    timezone: "UTC"
  # Match the composer/npm blocks: main is the integration branch.
  target-branch: "main"
  cooldown:
    default-days: 3
  open-pull-requests-limit: 5
  groups:
    actions:
      applies-to: version-updates
      patterns: ["*"]
      update-types: ["minor", "patch"]
    actions-security:
      applies-to: security-updates
      patterns: ["*"]
  commit-message:
    prefix: "chore"
    include: "scope"
  rebase-strategy: "auto"
