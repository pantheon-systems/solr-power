version: 2
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: weekly
    timezone: America/Los_Angeles
    day: tuesday
  target-branch: "develop"
  open-pull-requests-limit: 99
  groups:
    composer-minor-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: phpunit/phpunit
    versions:
    - ">= 8.a"
    - "< 9"
  - dependency-name: phpunit/phpunit
    versions:
    - ">= 9.a"
    - "< 10"
  - dependency-name: solarium/solarium
    versions: ["5.x"]
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    timezone: America/Los_Angeles
    day: tuesday
  target-branch: "develop"
  open-pull-requests-limit: 99
  groups:
    npm-minor-patch:
      update-types:
      - minor
      - patch
